[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "energiewende-analytics"
version = "1.0.0"
description = "Germany Energiewende: Market Structure, Affordability & Social Resilience Analytics (2013-2023)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4.0",
    "numpy>=2.0,<3.0",
    "matplotlib>=3.9,<4.0",
    "statsmodels>=0.14,<1.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[project.scripts]
energiewende-pipeline = "energiewende.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["energiewende"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
